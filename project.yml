name: KUME
options:
  bundleIdPrefix: app.kriszu.kume
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: PX694P4CGY
    CODE_SIGN_IDENTITY: "-"
    INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 ZOOL LLC. 原创源码 MIT；发行包 GPL-3.0。"
  configs:
    Debug:
      CODE_SIGN_IDENTITY: Apple Development
packages:
  KUMEKit:
    path: Packages/KUMEKit
targets:
  KUME:
    type: application
    platform: macOS
    productName: KUME
    sources:
      - path: Apps/KUME
      - path: Apps/Shared
    dependencies:
      - package: KUMEKit
        product: RimeKit
      - package: KUMEKit
        product: KUMECore
      - package: KUMEKit
        product: KUMEPanel
      - package: KUMEKit
        product: KUMEAI
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
    info:
      path: Apps/KUME/Info.plist
      properties:
        CFBundleDisplayName: KUME
        CFBundleName: KUME
        NSHumanReadableCopyright: "© 2026 ZOOL LLC. 原创源码 MIT；发行包 GPL-3.0。"
        LSUIElement: true
        LSBackgroundOnly: false
        NSPrincipalClass: NSApplication
        LSApplicationCategoryType: public.app-category.utilities
        InputMethodConnectionName: app.kriszu.inputmethod.kume_Connection
        InputMethodServerControllerClass: KUMEInputController
        InputMethodServerDelegateClass: KUMEInputController
        tsInputMethodIconFileKey: KUME.pdf
        tsInputMethodCharacterRepertoireKey: [Hans, Hant, Latn]
        TISInputSourceID: app.kriszu.inputmethod.kume
        TICapsLockLanguageSwitchCapable: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ComponentInputModeDict:
          tsInputModeListKey:
            app.kriszu.inputmethod.kume.hans:
              TISInputSourceID: app.kriszu.inputmethod.kume.hans
              TISIntendedLanguage: zh-Hans
              tsInputModeScriptKey: smUnicodeScript
              tsInputModeCharacterRepertoireKey: [Hans, Hant]
              tsInputModeKeyEquivalentModifiersKey: 4608
              tsInputModeMenuIconFileKey: KUME.pdf
              tsInputModeAlternateMenuIconFileKey: KUME.pdf
              tsInputModePaletteIconFileKey: KUME.pdf
              tsInputModePrimaryInScriptKey: true
              tsInputModeIsVisibleKey: true
              tsInputModeDefaultStateKey: true
          tsVisibleInputModeOrderedArrayKey: [app.kriszu.inputmethod.kume.hans]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kriszu.inputmethod.kume
        KUME_INFO_TEMPLATE: "$(SRCROOT)/Apps/KUME/Info.plist"
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/KUMEInfo.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: Apps/KUME/KUME.entitlements
    preBuildScripts:
      - name: Stamp build metadata
        script: bash "$SRCROOT/scripts/stamp-build-metadata.sh"
        inputFiles: ["$(KUME_INFO_TEMPLATE)"]
        outputFiles: ["$(DERIVED_FILE_DIR)/KUMEInfo.plist"]
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed librime plugins and SharedSupport
        script: bash "$SRCROOT/scripts/embed-runtime.sh"
        basedOnDependencyAnalysis: false
  KUME Settings:
    type: application
    platform: macOS
    productName: KUME Settings
    sources:
      - path: Apps/KUMESettings
        excludes: [".impeccable"]
      - path: Apps/Shared
    dependencies:
      - package: KUMEKit
        product: KUMECore
      - package: KUMEKit
        product: KUMEPanel
      - package: KUMEKit
        product: KUMEAI
    info:
      path: Apps/KUMESettings/Info.plist
      properties:
        CFBundleDisplayName: KUME Settings
        CFBundleName: KUME Settings
        NSHumanReadableCopyright: "© 2026 ZOOL LLC. 原创源码 MIT；发行包 GPL-3.0。"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # kume-ime://theme?v=1&d=… links from aime.zool.app/themes (docs/themes.md).
        CFBundleURLTypes:
          - CFBundleURLName: app.kriszu.kume.theme
            CFBundleURLSchemes: [kume-ime]
            CFBundleTypeRole: Viewer
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.kriszu.kume.settings
        KUME_INFO_TEMPLATE: "$(SRCROOT)/Apps/KUMESettings/Info.plist"
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/KUMEInfo.plist"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/KUMESettings/KUMESettings.entitlements
    preBuildScripts:
      - name: Stamp build metadata
        script: bash "$SRCROOT/scripts/stamp-build-metadata.sh"
        inputFiles: ["$(KUME_INFO_TEMPLATE)"]
        outputFiles: ["$(DERIVED_FILE_DIR)/KUMEInfo.plist"]
        basedOnDependencyAnalysis: false
schemes:
  KUME:
    build:
      targets:
        KUME: all
        KUME Settings: all
    run:
      config: Debug
  KUME Settings:
    build:
      targets:
        KUME Settings: all
    run:
      config: Debug
